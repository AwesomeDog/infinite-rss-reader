<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Infinite RSS Reader</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='3' width='20' height='18' fill='%23fff' stroke='%23333' stroke-width='1.5' rx='1'/><rect x='4' y='5' width='16' height='3' fill='%23333'/><text x='12' y='7.5' font-family='Arial' font-size='2.5' font-weight='bold' text-anchor='middle' fill='%23fff'>NEWS</text><rect x='4' y='9' width='7' height='1' fill='%23333'/><rect x='13' y='9' width='7' height='1' fill='%23333'/><rect x='4' y='11' width='7' height='1' fill='%23333'/><rect x='13' y='11' width='7' height='1' fill='%23333'/><rect x='4' y='13' width='16' height='1' fill='%23333'/><rect x='4' y='15' width='16' height='1' fill='%23333'/><rect x='4' y='17' width='12' height='1' fill='%23333'/></svg>"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.18/dayjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/5.27.4/antd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.27.4/reset.min.css" crossorigin="anonymous"/>
    <style>
        .main-content { padding: 0 25%; margin: 24px 0 }
        .stats-panel { position: fixed; left: 20px; top: 50%; transform: translateY(-50%); z-index: 1000 }
        .stats-toggle-btn { display: none }
        .rss-item { margin-bottom: 24px }
        .rss-item * { max-width: 100%; height: auto; box-sizing: border-box }
        .rss-item .ant-card { transition: all .3s ease }
        .rss-item.unread .ant-card { border-color: #696FC7; box-shadow: 0 2px 8px #A7AAE1; border-radius: 8px }
        .rss-item.read .ant-card { border-style: dashed; border-color: #d9d9d9; box-shadow: none }
        .rss-item .ant-card:hover { border-color: #fa8c16 !important; box-shadow: 0 4px 12px rgba(250, 140, 22, .3) !important }
        .rss-item.active .ant-card { border-color: #fa8c16 !important; box-shadow: 0 0 0 2px rgba(250, 140, 22, .35) !important }
        .date-link:hover { opacity: .7 }
        .rss-item .ant-card-head-title { white-space: normal !important }
        .rss-item .ant-card-head-title, .rss-item .ant-card-body,
        .rss-item-content table, .rss-item-content th, .rss-item-content td { word-wrap: break-word; word-break: break-word }
        .rss-item-content { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch }
        .rss-item-content table { max-width: none; border-collapse: collapse }
        .rss-item-body { position: relative; overflow: hidden; transition: max-height .3s ease }
        .rss-item-body.minimized { max-height: 120px }
        .rss-item-body-fade { position: absolute; inset: auto 0 0; height: 50px; pointer-events: none; background: linear-gradient(transparent, var(--ant-color-bg-container, #fff)) }
        @media (max-width: 768px) {
            .main-content { padding: 0 16px }
            .stats-panel { display: none }
            .stats-panel.visible, .stats-toggle-btn { display: block }
        }
        @media (min-width: 1400px) {
            .main-content { padding: 0 10%; overflow-x: hidden }
            .rss-list-container .ant-list-items { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 24px }
            .rss-list-container .rss-item { margin-bottom: 0; min-width: 0; overflow: hidden }
        }
        @media (min-width: 1700px) { .rss-list-container { --cols: 3 } }
        @media (min-width: 2000px) {
            .main-content { padding: 0 5% }
            .rss-list-container { --cols: 4 }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
    const {useState, useEffect, useRef, useCallback, useMemo} = React;
    const {
        Layout, Divider, List, Card, Typography, Spin, Tag, Button, ConfigProvider,
        theme, Statistic, FloatButton, message, Tooltip, Switch, Space, Modal, Tree, Input
    } = antd;
    const {DirectoryTree} = Tree, {Content} = Layout, {Text} = Typography;
    const APP_NAME = "Infinite RSS Reader";
    const SHORTCUTS = [["j", "Next article"], ["k", "Previous article"], ["o", "Open original link"],
        ["m", "Collapse / expand article"], ["c", "Copy article link"], ["g", "Jump to top"], ["?", "Show this help"]];
    // Hoisted so they are not re-allocated on every render.
    const ICON_BTN = {background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, padding: '4px 8px'};
    const PLAIN_LINK = {textDecoration: 'none'}, FULL_W = {width: "100%"};
    const NEW_TAB = {target: "_blank", rel: "noopener noreferrer"};
    const SHOT_OPTS = {
        imagePlaceholder: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=',
        skipFonts: true, allowTaint: true
    };

    const copyText = (text) => text
        ? navigator.clipboard.writeText(text).then(() => message.success("Link copied!"), () => message.error("Copy failed."))
        : message.warning("Nothing to copy.");

    // First item still visible below the top edge — the fallback "current" article.
    const viewportIndex = () => {
        const els = document.querySelectorAll(".rss-item");
        for (let i = 0; i < els.length; i++) if (els[i].getBoundingClientRect().bottom > 120) return i;
        return Math.max(0, els.length - 1);
    };

    const useStoredState = (key, parse) => {
        const [value, setValue] = useState(() => parse(localStorage.getItem(key)));
        useEffect(() => { localStorage.setItem(key, String(value)); }, [key, value]);
        return [value, setValue];
    };

    const PARAMS = (() => {
        const p = new URLSearchParams(location.search);
        return {itemId: p.get("itemId"), folder: p.get("folder"), unread: p.get("unread") === "true"};
    })();

    const apiGet = (path, fallback = []) => fetch(`/api/rss/${path}`).then(r => r.json()).then(j => j.data || fallback);
    const markRead = (itemId) => fetch(`/api/rss/mark-read?itemId=${itemId}`).catch(console.error);

    // Resolve items from URL params: single item > folder+unread > folder > all unread
    const fetchItems = async () => {
        if (PARAMS.itemId) return [await apiGet(`item?itemId=${PARAMS.itemId}`, null)].filter(Boolean);
        if (!PARAMS.folder) return apiGet("unread");
        if (!PARAMS.unread) return apiGet(`folder?folder=${encodeURIComponent(PARAMS.folder)}`);
        return (await apiGet("unread")).filter(({folderPath}) => folderPath.startsWith(PARAMS.folder));
    };

    // Build folder tree from items, each node counting itself + descendants.
    const buildFolderTree = (items) => {
        const counts = {}, root = {};
        items.forEach(({folderPath}) => {
            if (!folderPath) return;
            counts[folderPath] = (counts[folderPath] || 0) + 1;
            let cur = root, acc = '';
            folderPath.split('/').filter(Boolean).forEach((part) => {
                acc += '/' + part;
                cur = (cur[part] || (cur[part] = {children: {}, fullPath: acc})).children;
            });
        });
        const walk = (obj) => Object.entries(obj).map(([title, {children, fullPath}]) => {
            const kids = walk(children);
            return {
                title, fullPath, key: fullPath || title, children: kids.length ? kids : undefined,
                count: (counts[fullPath] || 0) + kids.reduce((sum, c) => sum + c.count, 0)
            };
        });
        return walk(root);
    };

    const FolderTreeModal = ({open, onClose, treeData}) => (
        <Modal title="📁 Folder Navigation" open={open} onCancel={onClose} footer={null}>
            {treeData.length ? (
                <DirectoryTree defaultExpandAll treeData={treeData} style={{overflow: 'auto'}}
                    onSelect={(_, {node}) => node.fullPath && window.open(`/?unread=true&folder=${encodeURIComponent(node.fullPath)}`, '_blank')}
                    titleRender={(node) => <span>{node.title}{node.count > 0 &&
                    <Tag color="blue" style={{marginLeft: 8}}>{node.count}</Tag>}</span>}/>
            ) : <Text type="secondary">No folder data available</Text>}
        </Modal>
    );

    const StatsPanel = ({total, read, displayed, loading, themeMode, toggleTheme, screenshotMode, toggleScreenshotMode, cardMode, toggleCardMode, showStats, openModal}) => (
        <Card className={`stats-panel ${showStats ? "visible" : ""}`} size="small" title="Statistics"
            styles={{header: {textAlign: "center"}, body: {textAlign: "center"}}}>
            <Spin spinning={loading}>
                <Statistic title="Total" value={total}/>
                <Statistic title="Loaded" value={displayed}/>
                <Tooltip title="Items skipped during fast scrolling are not counted as read">
                    <div><Statistic title="Read" value={read}/></div>
                </Tooltip>
            </Spin>
            <Divider/>
            <div style={{display: "flex", flexDirection: "column", gap: 8}}>
                {[[themeMode === "light", toggleTheme, "Light Theme", "Dark Theme", "☀️", "🌙"],
                    [screenshotMode, toggleScreenshotMode, "Screenshot Full Card", "Screenshot Body Only", "📸 Full", "📸 Body"],
                    [cardMode === "standard", toggleCardMode, "Standard Interface", "Compact Interface", "Standard", "Compact"]
                ].map(([checked, onChange, on, off, yes, no], i) => (
                    <Tooltip key={i} title={checked ? on : off}>
                        <Switch style={FULL_W} size="small" checkedChildren={yes} unCheckedChildren={no} checked={checked} onChange={onChange}/>
                    </Tooltip>
                ))}
                {[["folder", "📁 Folders", "Browse Folders"], ["block", "🚫 Block", "Manage block words"]].map(([key, label, tip]) => (
                    <Tooltip key={key} title={tip}>
                        <Button size="small" style={FULL_W} onClick={() => openModal(key)}>{label}</Button>
                    </Tooltip>
                ))}
            </div>
        </Card>
    );

    const BlockWordsModal = ({open, onClose, blockWords, setBlockWords}) => {
        const [draft, setDraft] = useState(blockWords);
        useEffect(() => { if (open) setDraft(blockWords); }, [open]);
        return (
            <Modal title="🚫 Block Words" open={open} onCancel={onClose} okText="Save" cancelText="Cancel"
                onOk={() => { setBlockWords(draft); onClose(); }}>
                <p><Text type="secondary">Comma-separated keywords. Matched items will be auto-minimized.</Text></p>
                <Input.TextArea autoSize={{minRows: 20, maxRows: 40}} placeholder="keyword1, keyword2, keyword3"
                    value={draft} onChange={e => setDraft(e.target.value)}/>
            </Modal>
        );
    };

    const HelpModal = ({open, onClose}) => (
        <Modal title="⌨️ Keyboard Shortcuts" open={open} onCancel={onClose} footer={null}>
            <List size="small" dataSource={SHORTCUTS} rowKey={([k]) => k} renderItem={([key, desc]) => (
                <List.Item>
                    <span style={{minWidth: 120, display: "inline-block"}}><kbd>{key}</kbd></span>
                    <Text type="secondary" style={{flex: 1, textAlign: "right"}}>{desc}</Text>
                </List.Item>
            )}/>
        </Modal>
    );

    const sanitizeHtml = (html) => {
        const doc = new DOMParser().parseFromString(html, "text/html");
        doc.querySelectorAll('base,script,iframe,object,embed,form,input,button,link[rel="stylesheet"]').forEach(n => n.remove());
        doc.querySelectorAll("*").forEach(el => [...el.attributes].forEach(({name, value}) => {
            const n = name.toLowerCase(), v = value.toLowerCase();
            if (n.startsWith("on") || ((n === "href" || n === "src") && (v.startsWith("javascript:") || v.startsWith("data:")))) el.removeAttribute(name);
        }));
        // Body links always open in a new tab -> never lose the reading position.
        // Skip the schemes that make no sense in a new tab (in-page anchors, mail/tel, ...).
        doc.querySelectorAll("a[href], area[href]").forEach(a => {
            if (/^(#|mailto:|tel:|sms:|javascript:|data:)/i.test((a.getAttribute("href") || "").trim())) return;
            a.setAttribute("target", "_blank");
            a.setAttribute("rel", "noopener noreferrer");
        });
        return doc.body.innerHTML;
    };

    const RssItem = React.memo(({item, index, active, toggled, onToggleMinimize, onBecameVisible, screenshotMode, cardMode, isRead, blockWordList}) => {
        const itemRef = useRef(null), contentRef = useRef(null), wasVisible = useRef(false);
        // Block-word collapse is the default; a manual toggle flips it.
        const autoMinimized = useMemo(() => {
            const text = ((item.subject || '') + ' ' + (item.body || '')).toLowerCase();
            return blockWordList.some(w => text.includes(w));
        }, [item.subject, item.body, blockWordList]);
        const minimized = toggled ? !autoMinimized : autoMinimized;
        const isCompactMode = cardMode === "compact";

        useEffect(() => {
            const observer = new IntersectionObserver(([entry]) => {
                if (entry.isIntersecting) wasVisible.current = true;
                else if (wasVisible.current && entry.boundingClientRect.bottom < 0) {
                    onBecameVisible(item.id);
                    observer.disconnect();
                }
            }, {threshold: 0});
            itemRef.current && observer.observe(itemRef.current);
            return () => observer.disconnect();
        }, [item.id, onBecameVisible]);

        const handleScreenshot = async () => {
            const card = itemRef.current?.querySelector(".ant-card");
            const target = screenshotMode ? card : contentRef.current;
            if (!target) return message.error("No content to screenshot.");
            try {
                const blob = await htmlToImage.toBlob(target, {...SHOT_OPTS, backgroundColor: card ? getComputedStyle(card).backgroundColor : '#ffffff'});
                await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
                message.success("Screenshot copied!");
            } catch (e) {
                message.error("Screenshot failed.");
            }
        };

        const sanitizedBody = useMemo(() => (item.body ? sanitizeHtml(item.body) : ""), [item.body]);
        return (
            <div ref={itemRef} data-idx={index} className={`rss-item ${isRead ? "read" : "unread"}${active ? " active" : ""}`}>
                <Card title={item.subject || "No Title"} extra={
                    <Space>
                        {!isCompactMode && <button type="button" title={minimized ? "Maximize" : "Minimize"} style={ICON_BTN}
                            onClick={() => onToggleMinimize(item.id)}>{minimized ? "➕" : "➖"}</button>}
                        <button type="button" title="Take Screenshot" onClick={handleScreenshot} style={ICON_BTN}>📸</button>
                    </Space>}>
                    {!isCompactMode && (
                        <div style={{marginTop: -16, marginBottom: 16}}>
                            {item.link && <a href={item.link} {...NEW_TAB} title="View Source" style={{marginRight: 8}}>🔍</a>}
                            {item.folderPath && <a href={`/?folder=${encodeURIComponent(item.folderPath)}`} {...NEW_TAB} style={PLAIN_LINK}>
                                <Tag color="blue" style={{marginRight: 8, cursor: 'pointer'}}>{item.folderPath}</Tag></a>}
                            {item.author && <Text type="secondary">✍️: {item.author} | </Text>}
                            {item.date && <a href={`/?itemId=${item.id}`} {...NEW_TAB} className="date-link" style={PLAIN_LINK}>
                                <Text type="secondary" style={{cursor: 'pointer'}}>{new Date(item.date).toLocaleString()}</Text></a>}
                        </div>
                    )}
                    <div className={`rss-item-body${minimized ? ' minimized' : ''}`}>
                        {sanitizedBody && <div ref={contentRef} className="rss-item-content" dangerouslySetInnerHTML={{__html: sanitizedBody}}/>}
                        {minimized && <div className="rss-item-body-fade"/>}
                    </div>
                </Card>
            </div>
        );
    });

    const useRssData = () => {
        const [allItems, setAllItems] = useState([]);
        const [loading, setLoading] = useState(true);
        useEffect(() => {
            let alive = true;
            fetchItems().then(items => { if (alive) setAllItems(items); }).finally(() => { if (alive) setLoading(false); });
            return () => { alive = false; };
        }, []);
        return {allItems, loading, folderTreeData: useMemo(() => buildFolderTree(allItems), [allItems])};
    };

    const useInfiniteScroll = (allItems, loading, pageSize = 100) => {
        const [page, setPage] = useState(1);
        const sentinelRef = useRef(null);
        const displayedItems = useMemo(() => allItems.slice(0, page * pageSize), [allItems, page, pageSize]);
        useEffect(() => {
            const node = sentinelRef.current;
            if (loading || !node || displayedItems.length >= allItems.length) return;
            const obs = new IntersectionObserver(([entry]) => entry.isIntersecting && setPage(p => p + 1), {rootMargin: "4000px"});
            obs.observe(node);
            return () => obs.disconnect();
        }, [loading, displayedItems.length, allItems.length]);
        return {displayedItems, sentinelRef, hasMore: displayedItems.length < allItems.length};
    };

    const useReadTracker = () => {
        const [readItems, setReadItems] = useState(new Set());
        const seen = useRef(new Set()), queue = useRef([]), timer = useRef(null);
        const handleBecameVisible = useCallback((itemId) => {
            if (seen.current.has(itemId)) return;
            seen.current.add(itemId);
            queue.current.push(itemId);
            if (timer.current) return;
            timer.current = setTimeout(() => {
                timer.current = null;
                const batch = queue.current.splice(0);
                batch.forEach(markRead);
                setReadItems(prev => new Set([...prev, ...batch]));
            }, 50);
        }, []);
        return {readItems, handleBecameVisible};
    };

    const App = () => {
        // --- User Settings ---
        const [themeMode, setThemeMode] = useStoredState("themeMode", v => v || (window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
        const [screenshotMode, setScreenshotMode] = useStoredState("screenshotMode", v => v !== "false");
        const [cardMode, setCardMode] = useStoredState("cardMode", v => v || "standard");
        const [blockWords, setBlockWords] = useStoredState("blockWords", v => v || "");

        // --- UI States ---
        const [showStats, setShowStats] = useState(false);
        const [modal, setModal] = useState(null); // "folder" | "block" | "help" | null
        const closeModal = () => setModal(null);
        const [activeIndex, setActiveIndex] = useState(-1);
        // Only a keyboard move (j/k/g) should scroll; a mouse hover must not yank the page.
        const keyboardNavRef = useRef(false);
        const [toggledIds, setToggledIds] = useState(new Set());
        const toggleMinimize = useCallback((id) => setToggledIds(prev => {
            const next = new Set(prev);
            next.has(id) ? next.delete(id) : next.add(id);
            return next;
        }), []);

        // --- Core Business Logic ---
        const {allItems, loading, folderTreeData} = useRssData();
        const {displayedItems, sentinelRef, hasMore} = useInfiniteScroll(allItems, loading);
        const {readItems, handleBecameVisible} = useReadTracker();

        // --- Derived Data ---
        const blockWordList = useMemo(() => blockWords.split(/[,\uFF0C]/).map(w => w.trim().toLowerCase()).filter(Boolean), [blockWords]);
        const isDarkMode = themeMode === "dark";
        useEffect(() => {
            document.body.style.backgroundColor = isDarkMode ? "#141414" : "#fff";
            document.body.style.color = isDarkMode ? "rgba(255,255,255,0.85)" : "rgba(0,0,0,0.88)";
        }, [isDarkMode]);

        useEffect(() => {
            if (activeIndex < 0 || !keyboardNavRef.current) return;
            keyboardNavRef.current = false;
            document.querySelector(`.rss-item[data-idx="${activeIndex}"]`)?.scrollIntoView({behavior: "smooth", block: "start"});
        }, [activeIndex]);

        // Keep activeIndex in sync with whatever card the mouse is actually over,
        // so o/m/c act on the hovered item instead of a stale keyboard cursor.
        useEffect(() => {
            const onOver = (e) => {
                const idx = Number(e.target?.closest?.(".rss-item")?.dataset.idx);
                if (!Number.isNaN(idx)) setActiveIndex(idx);
            };
            window.addEventListener("mouseover", onOver);
            return () => window.removeEventListener("mouseover", onOver);
        }, []);

        // --- Keyboard Shortcuts (viewportIndex stays lazy: only computed on a handled key) ---
        useEffect(() => {
            const onKey = (e) => {
                const t = e.target;
                if (e.ctrlKey || e.metaKey || e.altKey || (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable))) return;
                const len = displayedItems.length;
                const cur = () => (activeIndex >= 0 ? activeIndex : viewportIndex());
                const move = (d) => { if (len) { keyboardNavRef.current = true; setActiveIndex(Math.max(0, Math.min(len - 1, cur() + d))); } };
                const withItem = (fn) => { const it = displayedItems[cur()]; it && fn(it); };
                const action = {
                    j: () => move(1),
                    k: () => move(-1),
                    o: () => withItem(it => it.link && window.open(it.link, "_blank", "noopener")),
                    m: () => withItem(it => toggleMinimize(it.id)),
                    c: () => withItem(it => copyText(it.link)),
                    g: () => { setActiveIndex(-1); window.scrollTo({top: 0, behavior: "smooth"}); },
                    "?": () => setModal("help")
                }[e.key];
                action && action();
            };
            window.addEventListener("keydown", onKey);
            return () => window.removeEventListener("keydown", onKey);
        }, [displayedItems, activeIndex, toggleMinimize]);

        // --- Dynamic Title Update ---
        useEffect(() => {
            const prefix = PARAMS.itemId ? (allItems[0]?.subject || "Loading Item...")
                : PARAMS.folder ? `${PARAMS.folder.split('/').filter(Boolean).pop() || PARAMS.folder}${PARAMS.unread ? " (Unread)" : ""}` : "";
            document.title = prefix ? `${prefix} - ${APP_NAME}` : APP_NAME;
        }, [allItems]);

        return (
            <ConfigProvider theme={{
                cssVar: true,
                algorithm: isDarkMode ? theme.darkAlgorithm : theme.defaultAlgorithm,
                token: {fontFamily: "'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'"}
            }}>
                <Layout style={{minHeight: "100vh", background: "transparent"}}>
                    <Content className="main-content">
                        <StatsPanel total={allItems.length} read={readItems.size} displayed={displayedItems.length}
                            loading={loading && !displayedItems.length} themeMode={themeMode} cardMode={cardMode}
                            screenshotMode={screenshotMode} showStats={showStats} openModal={setModal}
                            toggleTheme={() => setThemeMode(m => m === "light" ? "dark" : "light")}
                            toggleScreenshotMode={() => setScreenshotMode(m => !m)}
                            toggleCardMode={() => setCardMode(m => m === "standard" ? "compact" : "standard")}/>
                        <FolderTreeModal open={modal === "folder"} onClose={closeModal} treeData={folderTreeData}/>
                        <BlockWordsModal open={modal === "block"} onClose={closeModal} blockWords={blockWords} setBlockWords={setBlockWords}/>
                        <HelpModal open={modal === "help"} onClose={closeModal}/>
                        <List className="rss-list-container" rowKey="id" dataSource={displayedItems} renderItem={(item, index) => <RssItem
                            item={item} index={index} active={index === activeIndex} toggled={toggledIds.has(item.id)}
                            onToggleMinimize={toggleMinimize}
                            onBecameVisible={handleBecameVisible} screenshotMode={screenshotMode}
                            cardMode={cardMode} isRead={readItems.has(item.id)} blockWordList={blockWordList}/>}/>
                        <div ref={sentinelRef} style={{height: 20, marginBottom: 20}}/>
                        {loading && displayedItems.length > 0 && <Spin style={{marginTop: 24}}/>}
                        {!hasMore && displayedItems.length > 0 &&
                            <div style={{textAlign: "center", margin: "20px 0"}}><Text type="secondary">All items
                                loaded.</Text></div>}
                    </Content>
                </Layout>
                <FloatButton icon="⚙️" className="stats-toggle-btn" style={{right: 24, bottom: 84}}
                        onClick={() => setShowStats(!showStats)}/>
                <FloatButton.BackTop style={{right: 24, bottom: 24}}/>
            </ConfigProvider>
        );
    };

    ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
